[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "TwinTurbo.ai"
version = "0.1.0"
description = "As-of data, operational GFS archive and versioned wind forecast replay"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pydantic>=2.8", "PyYAML>=6", "tzdata"]

[project.optional-dependencies]
weather-grib = ["eccodes>=2.37"]
test = ["pytest>=8"]
ui = ["streamlit==1.64.0"]
ml = ["scikit-learn==1.8.0"]

[project.scripts]
windoracle = "windoracle.cli:main"
"TwinTurbo.ai" = "windoracle.cli:main"
twinturbo = "windoracle.cli:main"

[tool.setuptools]
packages = ["windoracle", "windoracle.agents", "windoracle.weather", "windoracle.models", "TwinTurbo", "TwinTurbo.ai", "frontend", "ui"]
package-dir = {windoracle = "src/TwinTurbo.ai", TwinTurbo = "src/TwinTurbo", frontend = "frontend", ui = "ui"}

[tool.setuptools.package-data]
frontend = ["assets/*", "fixtures/*.json", "fixtures/exports/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
