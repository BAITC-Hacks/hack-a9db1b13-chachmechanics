[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windoracle"
version = "0.1.0"
description = "As-of data, operational GFS archive and versioned wind forecast replay"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pydantic>=2.8", "PyYAML>=6", "tzdata"]

[project.optional-dependencies]
weather-grib = ["eccodes>=2.37"]
test = ["pytest>=8"]

[project.scripts]
windoracle = "windoracle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
